services:
  - type: redis
    name: ai-agent-redis
    region: singapore
    plan: free
    ipAllowList: [] # Bắt buộc bởi quy định bảo mật mới của Render

  - type: web
    name: ai-agent-production
    runtime: docker
    dockerContext: 06-lab-complete
    dockerfilePath: 06-lab-complete/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_VERSION
        value: "1.0.0"
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DAILY_BUDGET_USD
        value: "10.0"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-agent-redis
          property: connectionString
